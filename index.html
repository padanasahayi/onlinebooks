    <script>
        /**
         * =========================================================================
         * MINI AI TRANSLATION MODULE (HYBRID NEURAL & CACHED MALAYALAM ENGINE)
         * =========================================================================
         */
        class MiniAITranslatorEngine {
            constructor() {
                // In-Memory Rapid Cache
                this.memoryCache = new Map();
                // Network Translation Status
                this.isProcessing = false;
            }

            /**
             * Primary Translate Method with Multi-Provider Neural Fallback Strategy
             */
            async translateTextToMalayalam(text) {
                if (!text || text.trim() === '') return '';

                const cleanText = text.trim();
                const cacheKey = cleanText.toLowerCase();

                // 1. Check Memory Cache
                if (this.memoryCache.has(cacheKey)) {
                    return this.memoryCache.get(cacheKey);
                }

                // 2. Check IndexedDB Translation Store
                const idbCached = await VayanappuraDB.getTranslationCache(cacheKey);
                if (idbCached) {
                    this.memoryCache.set(cacheKey, idbCached);
                    return idbCached;
                }

                // 3. Provider Strategy 1: Google Neural Free API Endpoint
                try {
                    const translated = await this._fetchGoogleTranslateAPI(cleanText);
                    if (translated) {
                        this._cacheResult(cacheKey, translated);
                        return translated;
                    }
                } catch (e) {
                    console.warn('Google Translate API fallback triggered:', e);
                }

                // 4. Provider Strategy 2: MyMemory Neural Translation API
                try {
                    const translated = await this._fetchMyMemoryAPI(cleanText);
                    if (translated) {
                        this._cacheResult(cacheKey, translated);
                        return translated;
                    }
                } catch (e) {
                    console.warn('MyMemory API fallback triggered:', e);
                }

                // 5. Provider Strategy 3: Lingva Open Endpoint
                try {
                    const translated = await this._fetchLingvaAPI(cleanText);
                    if (translated) {
                        this._cacheResult(cacheKey, translated);
                        return translated;
                    }
                } catch (e) {
                    console.warn('Lingva API fallback failed:', e);
                }

                return cleanText; // Return original text if network fails
            }

            /**
             * Save translation to memory and IndexedDB
             */
            _cacheResult(key, value) {
                this.memoryCache.set(key, value);
                VayanappuraDB.saveTranslationCache(key, value);
            }

            /**
             * Neural Fetcher 1: Free Google Translation Endpoint
             */
            async _fetchGoogleTranslateAPI(text) {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ml&dt=t&q=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Google Translate HTTP Error');
                const data = await response.json();
                
                if (data && data[0]) {
                    return data[0].map(part => part[0]).join('');
                }
                return null;
            }

            /**
             * Neural Fetcher 2: MyMemory API
             */
            async _fetchMyMemoryAPI(text) {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ml`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('MyMemory HTTP Error');
                const data = await response.json();
                
                if (data && data.responseData && data.responseData.translatedText) {
                    return data.responseData.translatedText;
                }
                return null;
            }

            /**
             * Neural Fetcher 3: Lingva API
             */
            async _fetchLingvaAPI(text) {
                const url = `https://lingva.ml/api/v1/auto/ml/${encodeURIComponent(text)}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Lingva HTTP Error');
                const data = await response.json();
                return data.translation || null;
            }

            /**
             * High-Speed Batch Paragraph Processing Pipeline
             */
            async translatePageParagraphs(paragraphsArr, progressCallback) {
                const results = [];
                const batchSize = 3; // Parallel sub-chunk execution limit

                for (let i = 0; i < paragraphsArr.length; i += batchSize) {
                    const chunk = paragraphsArr.slice(i, i + batchSize);
                    const chunkPromises = chunk.map(p => this.translateTextToMalayalam(p));
                    const translatedChunk = await Promise.all(chunkPromises);
                    results.push(...translatedChunk);

                    if (progressCallback) {
                        progressCallback(Math.min(100, Math.round(((i + chunk.length) / paragraphsArr.length) * 100)));
                    }
                }
                return results;
            }
        }

        const miniAITranslator = new MiniAITranslatorEngine();


        /**
         * =========================================================================
         * INDEXEDDB LOCAL STORAGE MANAGER ('vayanappura_db')
         * =========================================================================
         */
        class VayanappuraDBManager {
            constructor() {
                this.dbName = 'vayanappura_db';
                this.dbVersion = 1;
                this.db = null;
            }

            async initDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.dbVersion);

                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        // Book store
                        if (!db.objectStoreNames.contains('books')) {
                            db.createObjectStore('books', { keyPath: 'id' });
                        }
                        // Translation Cache store
                        if (!db.objectStoreNames.contains('translations')) {
                            db.createObjectStore('translations', { keyPath: 'phrase' });
                        }
                    };

                    request.onsuccess = (event) => {
                        this.db = event.target.result;
                        resolve(this.db);
                    };

                    request.onerror = (event) => {
                        console.error('IndexedDB error:', event.target.error);
                        reject(event.target.error);
                    };
                });
            }

            async saveBook(book) {
                if (!this.db) await this.initDB();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('books', 'readwrite');
                    const store = tx.objectStore('books');
                    store.put(book);
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => reject(tx.error);
                });
            }

            async getAllBooks() {
                if (!this.db) await this.initDB();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('books', 'readonly');
                    const store = tx.objectStore('books');
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = () => reject(request.error);
                });
            }

            async saveTranslationCache(phrase, translation) {
                if (!this.db) await this.initDB();
                const tx = this.db.transaction('translations', 'readwrite');
                const store = tx.objectStore('translations');
                store.put({ phrase, translation, timestamp: Date.now() });
            }

            async getTranslationCache(phrase) {
                if (!this.db) await this.initDB();
                return new Promise((resolve) => {
                    const tx = this.db.transaction('translations', 'readonly');
                    const store = tx.objectStore('translations');
                    const request = store.get(phrase);
                    request.onsuccess = () => resolve(request.result ? request.result.translation : null);
                    request.onerror = () => resolve(null);
                });
            }
        }

        const VayanappuraDB = new VayanappuraDBManager();


        /**

        const SAMPLE_BOOKS = [
            {

                pages: [
                    "Das Glasperlenspiel is the last full-length novel by the German author Hermann Hesse. It was begun in 1931 and published in Switzerland in 1943 after being rejected for publication in Germany due to Hesse's anti-Fascist views.",
                    "The novel is set in an unspecified future date in the utopian province of Castalia. The Castalians lead an intellectual life devoted to the study of music, mathematics, and the playing of the Glass Bead Game.",
                    "Joseph Knecht, the main protagonist, enters the elite Castalian school system as a child. His exceptional musical talent and intellectual prowess earn him rapid advancement through the orders.",
                    "As Knecht rises to become the Master of the Game (Magister Ludi), he begins to question the isolation of Castalia from the rest of human society and the real struggles of the world outside."
                ]
            },
            {
                id: 'book-siddhartha',
                title: 'Siddhartha (സിദ്ധാർത്ഥൻ)',
                author: 'Hermann Hesse',
                coverBg: 'bg-emerald-800',
                pages: [
                    "In the shade of the house, in the sunshine of the riverbank near the boats, in the shade of the Sal-tree forest, Siddhartha grew up, the beautiful son of the Brahman.",
                    "Love touched the hearts of the Brahmans' daughters when Siddhartha walked through the streets of the town with a luminous forehead, with a royal eye, with slender hips.",
                    "Siddhartha learned to converse with the wise men, to practice meditation, and to recite the sacred word Om. But his soul was not at peace."
                ]

        /**
         * =========================================================================
         * APP STATE & CONTROLLER MANAGER
         * =========================================================================
         */
        class VayanappuraApp {
            constructor() {
                this.currentBook = SAMPLE_BOOKS[0];
                this.currentPageIndex = 0;
                this.isMalayalamActive = false;
                this.translatedPageCache = new Map(); // Page index -> Malayalam HTML
                this.currentFontSize = 18; // Default text size (px)
                this.currentTheme = 'dark'; // 'light', 'dark', 'sepia'

                // Touch swipe coordinates
                this.touchStartX = 0;
                this.touchEndX = 0;

                // Speech Synthesis State
                this.speechSynth = window.speechSynthesis;
                this.speakingUtterance = null;

                this.initApp();
            }

            async initApp() {
                await VayanappuraDB.initDB();
                
                // Save sample books into IndexedDB if not exists
                const existingBooks = await VayanappuraDB.getAllBooks();
                if (existingBooks.length === 0) {
                    for (const book of SAMPLE_BOOKS) {
                        await VayanappuraDB.saveBook(book);
                    }
                }

                this.setupEventListeners();
                this.loadBook(this.currentBook, 0);
                this.updateSavedBooksCount();
            }

            setupEventListeners() {
                // Navigation Tabs
                document.getElementById('nav-tab-reader').addEventListener('click', () => this.switchView('reader'));
                document.getElementById('nav-tab-library').addEventListener('click', () => {
                    this.switchView('library');
                    this.renderLibrary();
                });
                document.getElementById('nav-tab-discover').addEventListener('click', () => {
                    this.switchView('discover');
                    this.renderDiscover();
                });

                document.getElementById('btn-back-library').addEventListener('click', () => {
                    this.switchView('library');
                    this.renderLibrary();
                });

                // Reader Controls
                document.getElementById('btn-font-increase').addEventListener('click', () => this.changeFontSize(2));
                document.getElementById('btn-font-decrease').addEventListener('click', () => this.changeFontSize(-2));
                document.getElementById('btn-theme-toggle').addEventListener('click', () => this.cycleTheme());

                // Mini AI Translate Toggle Button
                document.getElementById('btn-toggle-translate').addEventListener('click', () => this.toggleTranslation());

                // Page Navigation Buttons
                document.getElementById('btn-prev-page').addEventListener('click', () => this.goToPage(this.currentPageIndex - 1));
                document.getElementById('btn-next-page').addEventListener('click', () => this.goToPage(this.currentPageIndex + 1));

                // Touch Swipe Gestures
                const canvas = document.getElementById('reader-canvas');
                canvas.addEventListener('touchstart', (e) => {
                    this.touchStartX = e.changedTouches[0].screenX;
                }, { passive: true });

                canvas.addEventListener('touchend', (e) => {
                    this.touchEndX = e.changedTouches[0].screenX;
                    this.handleSwipeGesture();
                }, { passive: true });

                // TTS Playback Controls
                document.getElementById('btn-tts-play').addEventListener('click', () => this.toggleTTSPlayback());
                document.getElementById('btn-tts-stop').addEventListener('click', () => this.stopTTS());

                // Import Custom Book
                document.getElementById('btn-import-book').addEventListener('click', () => {
                    document.getElementById('file-input-book').click();
                });
                document.getElementById('file-input-book').addEventListener('change', (e) => this.handleBookFileUpload(e));

                // Search trigger
                document.getElementById('btn-search-trigger').addEventListener('click', () => this.executeBookSearch());
            }

            /**
             * Switch Main Views (Reader, Library, Discover)
             */
            switchView(viewName) {
                document.getElementById('view-reader').classList.add('hidden');
                document.getElementById('view-library').classList.add('hidden');
                document.getElementById('view-discover').classList.add('hidden');

                // Reset nav colors
                const navTabs = document.querySelectorAll('.nav-tab');
                navTabs.forEach(tab => {
                    tab.classList.remove('text-brand-400', 'font-bold');
                    tab.classList.add('text-slate-400');
                });

                if (viewName === 'reader') {
                    document.getElementById('view-reader').classList.remove('hidden');
                    document.getElementById('nav-tab-reader').classList.add('text-brand-400', 'font-bold');
                } else if (viewName === 'library') {
                    document.getElementById('view-library').classList.remove('hidden');
                    document.getElementById('nav-tab-library').classList.add('text-brand-400', 'font-bold');
                } else if (viewName === 'discover') {
                    document.getElementById('view-discover').classList.remove('hidden');
                    document.getElementById('nav-tab-discover').classList.add('text-brand-400', 'font-bold');
                }
            }

            /**
             * Load Book into E-Reader
             */
            loadBook(book, pageIdx = 0) {
                this.currentBook = book;
                this.currentPageIndex = pageIdx;
                this.translatedPageCache.clear();
                this.isMalayalamActive = false;
                
                document.getElementById('current-book-title').textContent = book.title;
                this.updateTranslateButtonUI();
                this.renderCurrentPage();
            }

            /**
             * Render Current Reader Page Content
             */
            async renderCurrentPage() {
                const displayArea = document.getElementById('book-content-display');
                const pageWrapper = document.getElementById('page-content-wrapper');

                pageWrapper.classList.add('page-entering');

                const totalPages = this.currentBook.pages.length;
                document.getElementById('page-number-indicator').textContent = `താൾ ${this.currentPageIndex + 1} / ${totalPages}`;

                // Update pagination button states
                document.getElementById('btn-prev-page').disabled = (this.currentPageIndex <= 0);
                document.getElementById('btn-next-page').disabled = (this.currentPageIndex >= totalPages - 1);

                const originalEnglishText = this.currentBook.pages[this.currentPageIndex];

                if (this.isMalayalamActive) {
                    // Check if page translation is already in cache
                    if (this.translatedPageCache.has(this.currentPageIndex)) {
                        displayArea.innerHTML = this.translatedPageCache.get(this.currentPageIndex);
                    } else {
                        // Trigger Mini AI Translation
                        this.showTranslationTag(true);
                        displayArea.innerHTML = `<div class="p-4 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>മലയാളത്തിലേക്ക് പരിഭാഷപ്പെടുത്തുന്നു...</div>`;

                        const paragraphs = originalEnglishText.split('\n\n').filter(p => p.trim() !== '');
                        const translatedParagraphs = await miniAITranslator.translatePageParagraphs(paragraphs);
                        
                        const formattedHTML = translatedParagraphs.map(p => `<p class="mb-4 leading-relaxed">${p}</p>`).join('');
                        
                        this.translatedPageCache.set(this.currentPageIndex, formattedHTML);
                        displayArea.innerHTML = formattedHTML;
                        this.showTranslationTag(false);
                    }
                } else {
                    // Display Original English
                    const formattedHTML = originalEnglishText.split('\n\n').map(p => `<p class="mb-4 leading-relaxed">${p}</p>`).join('');
                    displayArea.innerHTML = formattedHTML;
                }

                // Apply text size styling
                displayArea.style.fontSize = `${this.currentFontSize}px`;

                setTimeout(() => {
                    pageWrapper.classList.remove('page-entering');
                    pageWrapper.classList.add('page-active');
                }, 50);
            }

            /**
             * Toggle Malayalam Translation On/Off
             */
            toggleTranslation() {
                this.isMalayalamActive = !this.isMalayalamActive;
                this.updateTranslateButtonUI();
                this.renderCurrentPage();

                if (this.isMalayalamActive) {
                    this.showToast('Mini AI പരിഭാഷ പ്രവൃതമാക്കി!');
                } else {
                    this.showToast('പ്രഥമ ഭാഷയിലേക്ക് മാറ്റി');
                }
            }

            updateTranslateButtonUI() {
                const btnText = document.getElementById('translate-btn-text');
                const btn = document.getElementById('btn-toggle-translate');

                if (this.isMalayalamActive) {
                    btnText.textContent = 'ഇംഗ്ലീഷിലേക്ക് മാറ്റുക';
                    btn.classList.remove('bg-brand-600', 'hover:bg-brand-700');
                    btn.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
                } else {
                    btnText.textContent = 'മലയാളത്തിലേക്ക് മാറ്റുക';
                    btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
                    btn.classList.add('bg-brand-600', 'hover:bg-brand-700');
                }
            }

            showTranslationTag(show) {
                const tag = document.getElementById('translation-status-tag');
                if (show) tag.classList.remove('hidden');
                else tag.classList.add('hidden');
            }

            /**
             * Pagination & Touch Gestures
             */
            goToPage(index) {
                if (index >= 0 && index < this.currentBook.pages.length) {
                    this.stopTTS();
                    this.currentPageIndex = index;
                    this.renderCurrentPage();
                    // Scroll canvas back to top
                    document.getElementById('reader-canvas').scrollTop = 0;
                }
            }

            handleSwipeGesture() {
                const swipeDistance = this.touchEndX - this.touchStartX;
                const minSwipeDistance = 50; // threshold in px

                if (swipeDistance < -minSwipeDistance) {
                    // Swipe Left -> Next Page
                    this.goToPage(this.currentPageIndex + 1);
                } else if (swipeDistance > minSwipeDistance) {
                    // Swipe Right -> Prev Page
                    this.goToPage(this.currentPageIndex - 1);
                }
            }

            /**
             * Typography & Theme Controls
             */
            changeFontSize(delta) {
                this.currentFontSize = Math.min(28, Math.max(14, this.currentFontSize + delta));
                document.getElementById('book-content-display').style.fontSize = `${this.currentFontSize}px`;
            }

            cycleTheme() {
                const canvas = document.getElementById('reader-canvas');
                if (this.currentTheme === 'dark') {
                    this.currentTheme = 'light';
                    canvas.className = 'flex-1 overflow-y-auto p-4 sm:p-6 reader-scroll relative select-text bg-slate-50 text-slate-900';
                } else if (this.currentTheme === 'light') {
                    this.currentTheme = 'sepia';
                    canvas.className = 'flex-1 overflow-y-auto p-4 sm:p-6 reader-scroll relative select-text bg-sepia-bg text-sepia-text';
                } else {
                    this.currentTheme = 'dark';
                    canvas.className = 'flex-1 overflow-y-auto p-4 sm:p-6 reader-scroll relative select-text bg-slate-900 text-slate-100';
                }
            }

            /**
             * NATURAL VOICE TTS ENGINE (Malayalam Web Speech)
             */
            toggleTTSPlayback() {
                if (this.speechSynth.speaking) {
                    if (this.speechSynth.paused) {
                        this.speechSynth.resume();
                        document.getElementById('btn-tts-play').innerHTML = `<i class="fa-solid fa-pause text-xs"></i>`;
                    } else {
                        this.speechSynth.pause();
                        document.getElementById('btn-tts-play').innerHTML = `<i class="fa-solid fa-play text-xs"></i>`;
                    }
                    return;
                }

                // Gather current rendered text
                const textToSpeak = document.getElementById('book-content-display').innerText;
                if (!textToSpeak) return;

                this.speakingUtterance = new SpeechSynthesisUtterance(textToSpeak);
                
                // Fine-tune tone for natural female voice synthesis
                this.speakingUtterance.pitch = 1.15; // Slightly higher female pitch
                this.speakingUtterance.rate = 0.90;  // Clear, readable speed rate

                // Voice selection
                const voices = this.speechSynth.getVoices();
                const mlVoice = voices.find(v => v.lang.includes('ml') || v.lang.includes('ml-IN')) || 
                                voices.find(v => v.name.toLowerCase().includes('female')) || voices[0];

                if (mlVoice) {
                    this.speakingUtterance.voice = mlVoice;
                }

                this.speakingUtterance.onstart = () => {
                    document.getElementById('btn-tts-play').innerHTML = `<i class="fa-solid fa-pause text-xs"></i>`;
                };

                this.speakingUtterance.onend = () => {
                    document.getElementById('btn-tts-play').innerHTML = `<i class="fa-solid fa-play text-xs"></i>`;
                };

                this.speechSynth.speak(this.speakingUtterance);
            }

            stopTTS() {
                if (this.speechSynth) {
                    this.speechSynth.cancel();
                    document.getElementById('btn-tts-play').innerHTML = `<i class="fa-solid fa-play text-xs"></i>`;
                }
            }

            /**
             * LIBRARY MANAGEMENT & INDEXEDDB SYNC
             */
            async renderLibrary() {
                const container = document.getElementById('library-books-list');
                const books = await VayanappuraDB.getAllBooks();

                if (books.length === 0) {
                    container.innerHTML = `<p class="text-center text-slate-400 py-8 text-xs">ലൈബ്രറിയിൽ പുസ്തകങ്ങളൊന്നും ഇല്ല</p>`;
                    return;
                }

                container.innerHTML = books.map(b => `
                    <div class="bg-white dark:bg-slate-800 p-3.5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700/80 flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <div class="w-10 h-12 ${b.coverBg || 'bg-brand-600'} rounded-lg flex items-center justify-center text-white shrink-0 shadow">
                                <i class="fa-solid fa-book"></i>
                            </div>
                            <div class="overflow-hidden">
                                <h3 class="font-bold text-xs sm:text-sm text-slate-800 dark:text-white truncate">${b.title}</h3>
                                <p class="text-[11px] text-slate-500 dark:text-slate-400">${b.author} • ${b.pages.length} താളുകൾ</p>
                            </div>
                        </div>
                        <button onclick="app.openBookFromLibrary('${b.id}')" class="bg-brand-600 hover:bg-brand-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shrink-0">
                            വായിക്കുക
                        </button>
                    </div>
                `).join('');

                this.updateSavedBooksCount();
            }

            async openBookFromLibrary(bookId) {
                const books = await VayanappuraDB.getAllBooks();
                const book = books.find(b => b.id === bookId);
                if (book) {
                    this.loadBook(book, 0);
                    this.switchView('reader');
                }
            }

            async updateSavedBooksCount() {
                const books = await VayanappuraDB.getAllBooks();
                document.getElementById('saved-count-text').textContent = `${books.length} സേവ്‌ ചെയ്തു`;
            }

            async handleBookFileUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (e) => {
                    const content = e.target.result;
                    // Split content into page chunks (~500 chars per page)
                    const chunks = content.match(/[\s\S]{1,600}/g) || [content];

                    const newBook = {
                        id: 'custom-' + Date.now(),
                        title: file.name.replace(/\.[^/.]+$/, ""),
                        author: 'ഉപയോക്താവ് ചേർത്തത്',
                        coverBg: 'bg-indigo-700',
                        pages: chunks
                    };

                    await VayanappuraDB.saveBook(newBook);
                    this.showToast('പുതിയ പുസ്തകം സേവ് ചെയ്യപ്പെട്ടു!');
                    this.renderLibrary();
                };
                reader.readAsText(file);
            }

            /**
             * DISCOVER / SEARCH SIMULATION
             */
            renderDiscover() {
                const container = document.getElementById('search-results-list');
                container.innerHTML = SAMPLE_BOOKS.map(b => `
                    <div class="bg-white dark:bg-slate-800 p-3.5 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center justify-between gap-3">
                        <div>
                            <h3 class="font-bold text-xs sm:text-sm text-slate-800 dark:text-white">${b.title}</h3>
                            <p class="text-[11px] text-slate-500">${b.author}</p>
                        </div>
                        <button onclick="app.downloadBookToLibrary('${b.id}')" class="bg-slate-200 dark:bg-slate-700 hover:bg-brand-600 hover:text-white text-slate-800 dark:text-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                            ഡൗൺലോഡ്
                        </button>
                    </div>
                `).join('');
            }

            async downloadBookToLibrary(bookId) {
                const book = SAMPLE_BOOKS.find(b => b.id === bookId);
                if (book) {
                    await VayanappuraDB.saveBook(book);
                    this.showToast('ലൈബ്രറിയിലേക്ക് ഡൗൺലോഡ് ചെയ്തു!');
                    this.updateSavedBooksCount();
                }
            }

            executeBookSearch() {
                const query = document.getElementById('search-input').value.toLowerCase();
                const container = document.getElementById('search-results-list');
                const filtered = SAMPLE_BOOKS.filter(b => b.title.toLowerCase().includes(query) || b.author.toLowerCase().includes(query));

                if (filtered.length === 0) {
                    container.innerHTML = `<p class="text-center text-slate-400 py-8 text-xs">പുസ്തകങ്ങളൊന്നും കണ്ടില്ല</p>`;
                    return;
                }

                container.innerHTML = filtered.map(b => `
                    <div class="bg-white dark:bg-slate-800 p-3.5 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center justify-between gap-3">
                        <div>
                            <h3 class="font-bold text-xs sm:text-sm text-slate-800 dark:text-white">${b.title}</h3>
                            <p class="text-[11px] text-slate-500">${b.author}</p>
                        </div>
                        <button onclick="app.downloadBookToLibrary('${b.id}')" class="bg-slate-200 dark:bg-slate-700 hover:bg-brand-600 hover:text-white text-slate-800 dark:text-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                            ഡൗൺലോഡ്
                        </button>
                    </div>
                `).join('');
            }

            showToast(message) {
                const toast = document.getElementById('toast-message');
                document.getElementById('toast-text').textContent = message;
                toast.classList.remove('opacity-0', 'pointer-events-none');
                toast.classList.add('opacity-100');

                setTimeout(() => {
                    toast.classList.remove('opacity-100');
                    toast.classList.add('opacity-0', 'pointer-events-none');
                }, 2500);
            }
        }

        // Initialize application on window load
        let app;
        window.addEventListener('load', () => {
            app = new VayanappuraApp();
        });
    </script>
</body>
</html>
