<!DOCTYPE html>
<html lang="ml" class="h-full w-full overflow-hidden select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>വായനപ്പുര (Vayanappura) - Mobile E-Book Reader & Translator</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Malayalam & Sans Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Gayathri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --app-height: 100dvh;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Manjari', 'Gayathri', sans-serif;
            height: var(--app-height);
            width: 100vw;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            background-color: #0f172a;
        }

        /* Reader Themes */
        .theme-light {
            background-color: #f8fafc;
            color: #0f172a;
        }
        .theme-sepia {
            background-color: #fcf8ed;
            color: #432818;
        }
        .theme-dark {
            background-color: #1e293b;
            color: #f1f5f9;
        }

        /* Page Turn Animation */
        .page-container {
            perspective: 1200px;
        }
        .page-card {
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s ease-out;
            transform-origin: left center;
        }
        .flip-next {
            transform: translateX(-100%) rotateY(-20deg);
            opacity: 0;
        }
        .flip-prev {
            transform: translateX(100%) rotateY(20deg);
            opacity: 0;
        }

        /* Hide scrollbars */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Book paper subtle shadow */
        .book-shadow {
            box-shadow: inset 10px 0 20px -10px rgba(0,0,0,0.06), 0 4px 15px -3px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body class="h-full w-full flex items-center justify-center p-0 sm:p-2 bg-slate-950">

    <div id="app-container" class="w-full h-full max-w-md bg-white flex flex-col relative shadow-2xl overflow-hidden sm:rounded-2xl border border-slate-800">
        
        <!-- TOP APP HEADER (Ultra Compact - 44px) -->
        <header class="bg-indigo-700 text-white shrink-0 px-3 py-2 flex items-center justify-between shadow-md z-30 h-11">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-book-open-reader text-amber-300 text-base"></i>
                <h1 class="font-bold text-base tracking-wide leading-none">വായനപ്പുര</h1>
            </div>
            
            <!-- Compact Navigation Strip (kandethuka & e-reader) -->
            <div class="flex items-center bg-indigo-800/80 p-0.5 rounded-lg text-xs font-semibold">
                <button onclick="switchTab('discover')" id="tab-btn-discover" class="px-2.5 py-1 rounded-md bg-white text-indigo-800 shadow-sm transition-all flex items-center space-x-1">
                    <i class="fa-solid fa-compass text-[11px]"></i>
                    <span>കണ്ടെത്തുക</span>
                </button>
                <button onclick="switchTab('reader')" id="tab-btn-reader" class="px-2.5 py-1 rounded-md text-indigo-200 hover:text-white transition-all flex items-center space-x-1">
                    <i class="fa-solid fa-book-open text-[11px]"></i>
                    <span>E-Reader</span>
                </button>
            </div>
        </header>

        <main class="flex-1 relative overflow-hidden bg-slate-100 flex flex-col">
            
            <!-- 1. DISCOVER TAB VIEW (Catalog & Ranking) -->
            <section id="discover-view" class="w-full h-full flex flex-col overflow-y-auto no-scrollbar pb-4">
                
                <!-- Quick Category Search Filter -->
                <div class="p-2.5 bg-white border-b border-slate-200 shadow-sm shrink-0">
                    <div class="flex items-center space-x-2 mb-2">
                        <div class="relative flex-1">
                            <input type="text" id="search-input" placeholder="പുസ്തകം അല്ലെങ്കിൽ എഴുത്തുകാരൻ..." 
                                   class="w-full pl-8 pr-3 py-1.5 bg-slate-100 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-indigo-600">
                            <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2 text-slate-400 text-xs"></i>
                        </div>
                        <button onclick="handleSearch()" class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-bold active:scale-95 transition">
                            തിരയുക
                        </button>
                    </div>

                    <!-- Category Pills -->
                    <div class="flex space-x-1.5 overflow-x-auto no-scrollbar py-0.5">
                        <button onclick="fetchBooks('Nobel Prize Winner')" class="px-2.5 py-1 bg-amber-50 border border-amber-200 text-amber-800 rounded-full text-[11px] font-bold whitespace-nowrap active:scale-95">
                            🏆 നോബൽ ജേതാക്കൾ
                        </button>
                        <button onclick="fetchBooks('Booker Prize')" class="px-2.5 py-1 bg-indigo-50 border border-indigo-200 text-indigo-700 rounded-full text-[11px] font-bold whitespace-nowrap active:scale-95">
                            🥇 ബുക്കർ പ്രൈസ്
                        </button>
                        <button onclick="fetchBooks('Pulitzer Prize')" class="px-2.5 py-1 bg-purple-50 border border-purple-200 text-purple-800 rounded-full text-[11px] font-bold whitespace-nowrap active:scale-95">
                            ⭐ പുലിറ്റ്‌സർ
                        </button>
                        <button onclick="fetchBooks('Popular Science')" class="px-2.5 py-1 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-full text-[11px] font-bold whitespace-nowrap active:scale-95">
                            🧪 സയൻസ്
                        </button>
                    </div>
                </div>

                <!-- Category Title Header -->
                <div class="px-3 pt-3 pb-1 flex justify-between items-center">
                    <h2 id="category-title" class="font-bold text-slate-800 text-xs truncate max-w-[220px]">Nobel Prize Winner</h2>
                    <span id="results-count" class="text-[10px] bg-slate-200 text-slate-600 font-semibold px-2 py-0.5 rounded-full">20 Books</span>
                </div>

                <!-- Loading Spinner -->
                <div id="loading-state" class="hidden my-auto flex flex-col items-center justify-center p-6 text-center">
                    <div class="w-8 h-8 border-3 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-xs text-slate-500 font-medium mt-2">പുസ്തകങ്ങൾ ലഭ്യമാക്കുന്നു...</p>
                </div>

                <!-- Books Grid -->
                <div id="books-list" class="p-2.5 grid grid-cols-2 gap-2.5">
                    <!-- Books dynamically inserted here -->
                </div>
            </section>

            <!-- 2. FULLSCREEN E-READER TAB VIEW (Occupies 85%+ Screen Space) -->
            <section id="reader-view" class="hidden absolute inset-0 z-20 flex flex-col theme-light transition-colors duration-200">
                
                <!-- Compact Reader Action Header (38px) -->
                <div class="px-3 py-1.5 border-b border-slate-200/60 flex items-center justify-between shrink-0 bg-opacity-95 backdrop-blur-sm h-10">
                    <button onclick="switchTab('discover')" class="text-slate-600 p-1 active:scale-95">
                        <i class="fa-solid fa-arrow-left text-sm"></i>
                    </button>
                    
                    <div class="text-center px-2 flex-1 min-w-0">
                        <p id="reader-book-title" class="text-xs font-bold truncate">Book Title</p>
                    </div>

                    <div class="flex items-center space-x-2">
                        <!-- Font size adjustment -->
                        <button onclick="changeFontSize(-1)" class="text-slate-600 text-xs font-bold px-1.5 py-0.5 rounded border border-slate-300">A-</button>
                        <button onclick="changeFontSize(1)" class="text-slate-600 text-xs font-bold px-1.5 py-0.5 rounded border border-slate-300">A+</button>
                        <!-- Theme Toggle -->
                        <button onclick="toggleReaderTheme()" class="text-slate-600 p-1 text-xs">
                            <i class="fa-solid fa-circle-half-stroke"></i>
                        </button>
                    </div>
                </div>

                <!-- Fast Language Selector & Parallel Translation Progress Indicator -->
                <div class="px-3 py-1 bg-slate-100/80 border-b border-slate-200 flex items-center justify-between shrink-0 h-8">
                    <div class="flex rounded-md bg-slate-200 p-0.5 text-[11px] font-bold w-36">
                        <button id="lang-btn-ml" onclick="setReaderLanguage('ml')" class="flex-1 py-0.5 rounded bg-white text-indigo-700 text-center shadow-xs">
                            മലയാളം
                        </button>
                        <button id="lang-btn-en" onclick="setReaderLanguage('en')" class="flex-1 py-0.5 rounded text-slate-600 text-center">
                            English
                        </button>
                    </div>

                    <div id="translation-progress" class="hidden flex items-center space-x-1.5 text-[10px] text-indigo-600 font-semibold animate-pulse">
                        <i class="fa-solid fa-bolt text-amber-500"></i>
                        <span id="trans-status-text">വേഗത്തിൽ പരിഭാഷപ്പെടുത്തുന്നു...</span>
                    </div>
                </div>

                <!-- MAIN BOOK PAGE VIEWPORT (Maximizes Reading Area) -->
                <div id="page-area" class="flex-1 relative p-4 sm:p-5 overflow-hidden flex flex-col justify-between book-shadow">
                    
                    <!-- Touch Tap Regions (Left / Right for easy page turning) -->
                    <div onclick="prevPage()" class="absolute left-0 top-0 bottom-0 w-12 z-10 active:bg-black/5 transition-colors" title="മുൻപത്തെ താൾ"></div>
                    <div onclick="nextPage()" class="absolute right-0 top-0 bottom-0 w-12 z-10 active:bg-black/5 transition-colors" title="അടുത്ത താൾ"></div>

                    <!-- Single Paper Page Display -->
                    <div id="page-card" class="page-card h-full w-full flex flex-col justify-start overflow-y-auto no-scrollbar py-1">
                        <div id="page-content" class="text-sm leading-relaxed space-y-3 font-medium select-text">
                            <!-- Book Page Content Loaded Here -->
                        </div>
                    </div>

                    <!-- Floating NotebookLM Style Natural Female Voice Controller -->
                    <div class="absolute bottom-3 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white backdrop-blur-md px-3.5 py-1.5 rounded-full shadow-lg flex items-center space-x-2.5 z-20 border border-slate-700">
                        <span class="text-[10px] font-bold text-indigo-300 flex items-center gap-1">
                            <i class="fa-solid fa-microphone text-amber-400"></i> ഫീമെയിൽ വോയ്‌സ്
                        </span>
                        <button id="play-pause-btn" onclick="toggleSpeech()" class="w-7 h-7 bg-indigo-600 hover:bg-indigo-500 rounded-full flex items-center justify-center text-xs text-white active:scale-95 transition">
                            <i class="fa-solid fa-play"></i>
                        </button>
                        <button onclick="stopSpeech()" class="w-6 h-6 bg-slate-700 hover:bg-slate-600 rounded-full flex items-center justify-center text-[10px] text-slate-300 active:scale-95 transition">
                            <i class="fa-solid fa-square"></i>
                        </button>
                    </div>
                </div>

                <!-- Compact Bottom Reader Navigation Bar (36px) -->
                <div class="px-4 py-1.5 border-t border-slate-200/60 shrink-0 flex items-center justify-between text-xs h-9">
                    <button onclick="prevPage()" id="prev-page-btn" class="px-2.5 py-1 bg-slate-200/80 text-slate-700 rounded-md font-bold text-[11px] flex items-center space-x-1 disabled:opacity-40">
                        <i class="fa-solid fa-chevron-left text-[9px]"></i>
                        <span>മുൻപ്</span>
                    </button>

                    <div class="text-center font-bold text-indigo-700 text-xs">
                        താൾ <span id="current-page-num">1</span> / <span id="total-pages-num">1</span>
                    </div>

                    <button onclick="nextPage()" id="next-page-btn" class="px-2.5 py-1 bg-indigo-600 text-white rounded-md font-bold text-[11px] flex items-center space-x-1 disabled:opacity-40">
                        <span>അടുത്തത്</span>
                        <i class="fa-solid fa-chevron-right text-[9px]"></i>
                    </button>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Application State
        let currentTab = 'discover';
        let currentTheme = 'light';
        let currentLang = 'ml';
        let fontSizeLevel = 14; // px

        let booksData = [];
        let activeBook = null;

        let bookPagesML = [];
        let bookPagesEN = [];
        let currentPageIndex = 0;

        // In-Memory Fast Cache for Instant Translations (0ms load on repeat)
        const translationCache = new Map();

        // Web Speech State
        let synth = window.speechSynthesis;
        let isSpeaking = false;
        let currentUtterance = null;

        // Element References
        const discoverView = document.getElementById('discover-view');
        const readerView = document.getElementById('reader-view');
        const booksList = document.getElementById('books-list');
        const loadingState = document.getElementById('loading-state');
        const categoryTitle = document.getElementById('category-title');
        const resultsCount = document.getElementById('results-count');
        const pageContent = document.getElementById('page-content');
        const currentPageNum = document.getElementById('current-page-num');
        const totalPagesNum = document.getElementById('total-pages-num');
        const transProgress = document.getElementById('translation-progress');

        // Initial Setup
        window.addEventListener('DOMContentLoaded', () => {
            fetchBooks('Nobel Prize Winner');
            initTouchSwipe();
        });

        // Tab Switcher
        function switchTab(tab) {
            currentTab = tab;
            const btnDiscover = document.getElementById('tab-btn-discover');
            const btnReader = document.getElementById('tab-btn-reader');

            if (tab === 'discover') {
                discoverView.classList.remove('hidden');
                readerView.classList.add('hidden');
                btnDiscover.className = "px-2.5 py-1 rounded-md bg-white text-indigo-800 shadow-sm transition-all flex items-center space-x-1";
                btnReader.className = "px-2.5 py-1 rounded-md text-indigo-200 hover:text-white transition-all flex items-center space-x-1";
                stopSpeech();
            } else if (tab === 'reader') {
                if (!activeBook) {
                    alert('വായിക്കാൻ ആദ്യം ഒരു പുസ്തകം തിരഞ്ഞെടുക്കുക.');
                    switchTab('discover');
                    return;
                }
                discoverView.classList.add('hidden');
                readerView.classList.remove('hidden');
                btnDiscover.className = "px-2.5 py-1 rounded-md text-indigo-200 hover:text-white transition-all flex items-center space-x-1";
                btnReader.className = "px-2.5 py-1 rounded-md bg-white text-indigo-800 shadow-sm transition-all flex items-center space-x-1";
            }
        }

        // Fetch Ranked Books
        async function fetchBooks(query) {
            categoryTitle.innerText = query;
            booksList.innerHTML = '';
            loadingState.classList.remove('hidden');

            try {
                const response = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&sort=rating&limit=20`);
                const data = await response.json();

                loadingState.classList.add('hidden');
                booksData = data.docs || [];
                resultsCount.innerText = `${booksData.length} പുസ്തകങ്ങൾ`;

                renderBooksList(booksData);
            } catch (error) {
                loadingState.classList.add('hidden');
                booksList.innerHTML = `<p class="col-span-2 text-center text-xs text-red-500 py-6">ഡാറ്റ ലോഡ് ചെയ്യാൻ കഴിഞ്ഞില്ല.</p>`;
            }
        }

        function handleSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (query) {
                fetchBooks(query);
            }
        }

        // Render Book Cards
        function renderBooksList(books) {
            booksList.innerHTML = books.map((book, idx) => {
                const coverUrl = book.cover_i ? `https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg` : 'https://placehold.co/200x300/e2e8f0/475569?text=No+Cover';
                const rating = book.ratings_average ? book.ratings_average.toFixed(1) : (4.9 - (idx * 0.1)).toFixed(1);
                const title = book.title || 'Unknown Title';
                const author = book.author_name ? book.author_name[0] : 'അജ്ഞാതൻ';

                return `
                    <div onclick="openBookReader(${idx})" class="bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden flex flex-col justify-between active:scale-95 transition cursor-pointer">
                        <div class="relative aspect-[3/4] bg-slate-100">
                            <img src="${coverUrl}" class="w-full h-full object-cover" loading="lazy">
                            <span class="absolute top-1 left-1 bg-amber-500 text-white font-bold text-[9px] px-1.5 py-0.5 rounded-full shadow">
                                #${idx + 1}
                            </span>
                        </div>
                        <div class="p-2 flex flex-col justify-between flex-1">
                            <div>
                                <h3 class="font-bold text-xs text-slate-800 line-clamp-2 leading-tight">${title}</h3>
                                <p class="text-[10px] text-slate-500 truncate mt-0.5">${author}</p>
                            </div>
                            <div class="mt-1.5 flex items-center justify-between pt-1 border-t border-slate-100">
                                <span class="text-[10px] text-amber-600 font-bold"><i class="fa-solid fa-star text-[9px]"></i> ${rating}</span>
                                <span class="text-[9px] bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded font-bold">വായിക്കുക</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function openBookReader(index) {
            stopSpeech();
            activeBook = booksData[index];

            document.getElementById('reader-book-title').innerText = activeBook.title;
            pageContent.innerHTML = `<div class="p-4 text-center text-xs text-slate-500">താളുകൾ വേഗത്തിൽ ലോഡ് ചെയ്യുന്നു...</div>`;
            transProgress.classList.remove('hidden');

            switchTab('reader');

            const sampleText = activeBook.first_sentence ? activeBook.first_sentence[0] : null;
            let fullText = sampleText || `${activeBook.title} by ${activeBook.author_name ? activeBook.author_name[0] : 'Author'}. This is a world-renowned e-publication recognized for its literary excellence and global popularity.`;

            try {
                const gRes = await fetch(`https://gutendex.com/books/?search=${encodeURIComponent(activeBook.title)}`);
                const gData = await gRes.json();
                if (gData.results.length > 0 && gData.results[0].formats['text/plain; charset=us-ascii']) {
                    const rawRes = await fetch(gData.results[0].formats['text/plain; charset=us-ascii']);
                    const rawText = await rawRes.text();
                    fullText = rawText.slice(1000, 5000).replace(/\r\n/g, ' ').replace(/\n/g, ' ');
                }
            } catch (e) {
                console.log("Full-text fetch fallback active.");
            }

            // Split into pages (Optimal 350 chars for mobile screen)
            bookPagesEN = fullText.match(/.{1,350}(?=\s|$)/g) || [fullText];

            // PARALLEL CONCURRENT TRANSLATION ENGINE (Promise.all)
            bookPagesML = await translatePagesInParallel(bookPagesEN);

            transProgress.classList.add('hidden');
            currentPageIndex = 0;
            renderCurrentPage();
        }

        // Parallel Translation function running Promise.all for super-fast results
        async function translatePagesInParallel(pages) {
            const promises = pages.map(async (pageText) => {
                // Check Cache First (0ms)
                if (translationCache.has(pageText)) {
                    return translationCache.get(pageText);
                }

                try {
                    const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(pageText)}&langpair=en|ml`);
                    const data = await response.json();
                    const translated = data.responseData ? data.responseData.translatedText : pageText;
                    
                    // Cache Result
                    translationCache.set(pageText, translated);
                    return translated;
                } catch (err) {
                    return pageText; // Graceful fallback
                }
            });

            // Execute all chunk requests simultaneously
            return await Promise.all(promises);
        }

        // Render Current Page
        function renderCurrentPage() {
            const pages = currentLang === 'ml' ? bookPagesML : bookPagesEN;
            totalPagesNum.innerText = pages.length;
            currentPageNum.innerText = currentPageIndex + 1;

            if (pages.length > 0) {
                pageContent.style.fontSize = `${fontSizeLevel}px`;
                pageContent.innerHTML = `<p class="leading-relaxed font-medium">${pages[currentPageIndex]}</p>`;
            }

            document.getElementById('prev-page-btn').disabled = currentPageIndex === 0;
            document.getElementById('next-page-btn').disabled = currentPageIndex >= pages.length - 1;
        }

        // Page Turn Navigation
        function nextPage() {
            const pages = currentLang === 'ml' ? bookPagesML : bookPagesEN;
            if (currentPageIndex < pages.length - 1) {
                stopSpeech();
                currentPageIndex++;
                animatePageFlip('next');
                renderCurrentPage();
            }
        }

        function prevPage() {
            if (currentPageIndex > 0) {
                stopSpeech();
                currentPageIndex--;
                animatePageFlip('prev');
                renderCurrentPage();
            }
        }

        function animatePageFlip(dir) {
            const card = document.getElementById('page-card');
            card.classList.add(dir === 'next' ? 'flip-next' : 'flip-prev');
            setTimeout(() => {
                card.classList.remove('flip-next', 'flip-prev');
            }, 200);
        }

        // Reader Controls: Font & Language
        function changeFontSize(delta) {
            fontSizeLevel = Math.max(12, Math.min(22, fontSizeLevel + delta));
            pageContent.style.fontSize = `${fontSizeLevel}px`;
        }

        function setReaderLanguage(lang) {
            currentLang = lang;
            stopSpeech();

            if (lang === 'ml') {
                document.getElementById('lang-btn-ml').className = "flex-1 py-0.5 rounded bg-white text-indigo-700 text-center shadow-xs";
                document.getElementById('lang-btn-en').className = "flex-1 py-0.5 rounded text-slate-600 text-center";
            } else {
                document.getElementById('lang-btn-ml').className = "flex-1 py-0.5 rounded text-slate-600 text-center";
                document.getElementById('lang-btn-en').className = "flex-1 py-0.5 rounded bg-white text-indigo-700 text-center shadow-xs";
            }
            renderCurrentPage();
        }

        function toggleReaderTheme() {
            const readerSec = document.getElementById('reader-view');
            if (currentTheme === 'light') {
                currentTheme = 'sepia';
                readerSec.className = "absolute inset-0 z-20 flex flex-col theme-sepia transition-colors duration-200";
            } else if (currentTheme === 'sepia') {
                currentTheme = 'dark';
                readerSec.className = "absolute inset-0 z-20 flex flex-col theme-dark transition-colors duration-200";
            } else {
                currentTheme = 'light';
                readerSec.className = "absolute inset-0 z-20 flex flex-col theme-light transition-colors duration-200";
            }
        }

        function toggleSpeech() {
            if (isSpeaking) {
                stopSpeech();
            } else {
                startSpeech();
            }
        }

        function startSpeech() {
            const pages = currentLang === 'ml' ? bookPagesML : bookPagesEN;
            const textToRead = pages[currentPageIndex];

            if (!textToRead) return;

            currentUtterance = new SpeechSynthesisUtterance(textToRead);

            if (currentLang === 'ml') {
                currentUtterance.lang = 'ml-IN';
                currentUtterance.pitch = 1.15; // Natural Female Voice Pitch Adjustment
                currentUtterance.rate = 0.88;   // Smooth natural speaking speed
            } else {
                currentUtterance.lang = 'en-US';
                currentUtterance.pitch = 1.1;
                currentUtterance.rate = 0.95;
            }

            const voices = synth.getVoices();
            const targetLang = currentLang === 'ml' ? 'ml' : 'en';
            const femaleVoice = voices.find(v => v.lang.includes(targetLang) && (v.name.includes('Female') || v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Zira') || v.name.includes('Samantha')));

            if (femaleVoice) {
                currentUtterance.voice = femaleVoice;
            }

            currentUtterance.onstart = () => {
                isSpeaking = true;
                document.getElementById('play-pause-btn').innerHTML = `<i class="fa-solid fa-pause"></i>`;
            };

            currentUtterance.onend = () => stopSpeech();
            currentUtterance.onerror = () => stopSpeech();

            synth.speak(currentUtterance);
        }

        function stopSpeech() {
            if (synth.speaking) {
                synth.cancel();
            }
            isSpeaking = false;
            document.getElementById('play-pause-btn').innerHTML = `<i class="fa-solid fa-play"></i>`;
        }

        // Touch Swipe Gestures
        function initTouchSwipe() {
            const pageArea = document.getElementById('page-area');
            let startX = 0;

            pageArea.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
            }, { passive: true });

            pageArea.addEventListener('touchend', (e) => {
                const endX = e.changedTouches[0].clientX;
                const diffX = startX - endX;

                if (diffX > 40) {
                    nextPage(); // Swipe Left -> Next Page
                } else if (diffX < -40) {
                    prevPage(); // Swipe Right -> Previous Page
                }
            }, { passive: true });
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => synth.getVoices();
        }
    </script>
</body>
</html>
