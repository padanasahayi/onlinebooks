<!DOCTYPE html>
<html lang="ml" class="h-full w-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>E-Book Malayalam Reader App</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts for Malayalam -->
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS for Native Mobile App & Reader Styles -->
    <style>
        :root {
            --app-height: 100dvh;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Manjari', sans-serif;
            height: var(--app-height);
            width: 100vw;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Reader Themes */
        .theme-light {
            background-color: #f8fafc;
            color: #0f172a;
        }
        .theme-sepia {
            background-color: #fbf0d9;
            color: #432818;
        }
        .theme-dark {
            background-color: #0f172a;
            color: #f1f5f9;
        }

        /* Page Flip Animation */
        .page-container {
            perspective: 1000px;
        }
        .page-card {
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
            backface-visibility: hidden;
        }
        .page-flip-next-enter {
            transform: translateX(100%) rotateY(-15deg);
            opacity: 0;
        }
        .page-flip-prev-enter {
            transform: translateX(-100%) rotateY(15deg);
            opacity: 0;
        }

        /* Hide scrollbars for app container */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Text clamping */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 h-full w-full flex flex-col justify-between select-none">

    <!-- App Main Mobile Viewport Frame -->
    <div id="app-container" class="w-full h-full max-w-md mx-auto bg-slate-50 flex flex-col relative shadow-2xl overflow-hidden sm:border-x sm:border-slate-300">
        
        <!-- HEADER (App Bar) -->
        <header id="app-header" class="bg-indigo-700 text-white shrink-0 pt-safe px-4 py-3 shadow-md z-20 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="bg-indigo-800 p-2 rounded-xl text-amber-400">
                    <i class="fa-solid fa-book-open text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-wide leading-tight">വായനപ്പുര</h1>
                    <p class="text-[10px] text-indigo-200">E-Pub Translator & Reader</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-1">
                <button onclick="toggleSearchModal()" class="p-2 text-indigo-100 hover:text-white rounded-full active:bg-indigo-600">
                    <i class="fa-solid fa-magnifying-glass text-lg"></i>
                </button>
            </div>
        </header>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 relative overflow-hidden bg-slate-100">
            
            <!-- 1. DISCOVER / EXPLORE TAB VIEW -->
            <section id="discover-view" class="w-full h-full flex flex-col overflow-y-auto no-scrollbar pb-16">
                
                <!-- Category Filter Pills -->
                <div class="p-3 bg-white border-b border-slate-200 shadow-sm shrink-0">
                    <p class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">പ്രധാന വിഭാഗങ്ങൾ (Ranking Filter)</p>
                    <div class="flex space-x-2 overflow-x-auto no-scrollbar py-1">
                        <button onclick="fetchBooks('Nobel Prize Winner')" class="px-3 py-1.5 bg-indigo-50 border border-indigo-200 text-indigo-700 rounded-full text-xs font-semibold whitespace-nowrap active:scale-95 transition">
                            🏆 নোബൽ ജേതാക്കൾ
                        </button>
                        <button onclick="fetchBooks('Booker Prize Winner')" class="px-3 py-1.5 bg-amber-50 border border-amber-200 text-amber-800 rounded-full text-xs font-semibold whitespace-nowrap active:scale-95 transition">
                            🥇 ബുക്കർ പ്രൈസ്
                        </button>
                        <button onclick="fetchBooks('Pulitzer Prize')" class="px-3 py-1.5 bg-purple-50 border border-purple-200 text-purple-800 rounded-full text-xs font-semibold whitespace-nowrap active:scale-95 transition">
                            ⭐ പുലിറ്റ്‌സർ
                        </button>
                        <button onclick="fetchBooks('Popular Science')" class="px-3 py-1.5 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-full text-xs font-semibold whitespace-nowrap active:scale-95 transition">
                            🧪 സയൻസ്
                        </button>
                        <button onclick="fetchBooks('Classics')" class="px-3 py-1.5 bg-rose-50 border border-rose-200 text-rose-800 rounded-full text-xs font-semibold whitespace-nowrap active:scale-95 transition">
                            📚 ക്ലാസിക്സ്
                        </button>
                    </div>
                </div>

                <!-- Current Category Title & Count -->
                <div class="px-4 pt-4 pb-2 flex justify-between items-center">
                    <h2 id="category-title" class="font-bold text-slate-800 text-sm">നോബൽ പുരസ്കാരം നേടിയവ</h2>
                    <span id="results-count" class="text-[11px] bg-slate-200 text-slate-600 font-semibold px-2 py-0.5 rounded-full">20 Books</span>
                </div>

                <!-- Loading State -->
                <div id="loading-state" class="hidden my-auto flex flex-col items-center justify-center p-8 text-center">
                    <div class="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-xs text-slate-500 font-medium mt-3">പുസ്തകങ്ങൾ റാങ്ക് അടിസ്ഥാനത്തിൽ ലഭ്യമാക്കുന്നു...</p>
                </div>

                <!-- Books ListView (Card Grid) -->
                <div id="books-list" class="p-3 grid grid-cols-2 gap-3">
                    <!-- Dynamic Book Cards Injected Here -->
                </div>
            </section>

            <!-- 2. NATIVE E-READER TAB VIEW (Mobile Book Screen) -->
            <section id="reader-view" class="hidden absolute inset-0 z-30 flex flex-col theme-light transition-colors duration-200">
                
                <!-- Reader Navigation Header Bar -->
                <div id="reader-header" class="px-3 py-2 border-b flex items-center justify-between shrink-0 bg-opacity-90 backdrop-blur-sm">
                    <button onclick="switchTab('discover')" class="p-2 text-slate-600 rounded-full active:bg-slate-200">
                        <i class="fa-solid fa-chevron-left text-base"></i>
                    </button>
                    
                    <div class="text-center px-2 overflow-hidden flex-1">
                        <p id="reader-book-title" class="text-xs font-bold truncate">Book Title</p>
                        <p id="reader-book-author" class="text-[10px] text-slate-500 truncate">Author</p>
                    </div>

                    <!-- Reader Theme Toggle -->
                    <div class="flex items-center space-x-1">
                        <button onclick="toggleReaderTheme()" class="p-2 text-slate-600 rounded-full active:bg-slate-200" title="തീം മാറ്റുക">
                            <i class="fa-solid fa-palette text-sm"></i>
                        </button>
                    </div>
                </div>

                <!-- Reader Language Toggle Bar (Malayalam / English) -->
                <div class="px-4 py-2 border-b flex justify-between items-center text-xs shrink-0">
                    <div class="flex rounded-lg bg-slate-200 p-0.5 w-full">
                        <button id="lang-btn-ml" onclick="setReaderLanguage('ml')" class="flex-1 py-1 font-bold rounded-md bg-white shadow-sm text-indigo-700 text-center transition">
                            മലയാളം
                        </button>
                        <button id="lang-btn-en" onclick="setReaderLanguage('en')" class="flex-1 py-1 font-medium text-slate-600 text-center transition">
                            Original (English)
                        </button>
                    </div>
                </div>

                <!-- Page Container (Page Turning Area) -->
                <div id="page-area" class="flex-1 relative p-5 overflow-hidden flex flex-col justify-between touch-pan-y">
                    
                    <!-- Single Page Content Card -->
                    <div id="page-card" class="page-card h-full w-full flex flex-col justify-start overflow-y-auto no-scrollbar">
                        <div id="page-content" class="text-base leading-relaxed tracking-wide space-y-3 font-medium">
                            <!-- Dynamically Loaded Page Content -->
                        </div>
                    </div>

                    <!-- Voice Audio Controller Overlay Widget -->
                    <div class="absolute bottom-3 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white backdrop-blur-md px-4 py-2 rounded-full shadow-lg flex items-center space-x-3 z-20">
                        <span class="text-[10px] font-semibold text-indigo-300">വോയ്‌സ് വായന:</span>
                        <button id="play-pause-btn" onclick="toggleSpeech()" class="w-8 h-8 bg-indigo-600 rounded-full flex items-center justify-center text-xs text-white active:scale-95">
                            <i class="fa-solid fa-play"></i>
                        </button>
                        <button onclick="stopSpeech()" class="w-7 h-7 bg-slate-700 rounded-full flex items-center justify-center text-xs text-slate-300 active:scale-95">
                            <i class="fa-solid fa-square"></i>
                        </button>
                    </div>
                </div>

                <!-- Reader Page Turn Controls Bottom Bar -->
                <div id="reader-footer" class="px-4 py-3 border-t shrink-0 flex items-center justify-between text-xs">
                    <button onclick="prevPage()" id="prev-page-btn" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg font-semibold flex items-center space-x-1 active:scale-95">
                        <i class="fa-solid fa-chevron-left text-[10px]"></i>
                        <span>முൻപത്തെ താൾ</span>
                    </button>

                    <div class="text-center font-bold text-indigo-600">
                        <span id="current-page-num">1</span> / <span id="total-pages-num">1</span>
                    </div>

                    <button onclick="nextPage()" id="next-page-btn" class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg font-semibold flex items-center space-x-1 active:scale-95">
                        <span>അടുത്ത താൾ</span>
                        <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </button>
                </div>
            </section>
        </main>

        <!-- BOTTOM NAVIGATION BAR (Native Mobile App Navigation) -->
        <nav id="bottom-nav" class="bg-white border-t border-slate-200 shrink-0 h-14 flex items-center justify-around z-20">
            <button onclick="switchTab('discover')" id="nav-btn-discover" class="flex flex-col items-center justify-center text-indigo-600 w-full h-full">
                <i class="fa-solid fa-compass text-lg"></i>
                <span class="text-[10px] font-bold mt-0.5">കണ്ടെത്തുക</span>
            </button>
            <button onclick="switchTab('reader')" id="nav-btn-reader" class="flex flex-col items-center justify-center text-slate-400 w-full h-full">
                <i class="fa-solid fa-book-open text-lg"></i>
                <span class="text-[10px] font-bold mt-0.5">ഇ-റീഡർ</span>
            </button>
        </nav>

        <!-- SEARCH MODAL POPUP -->
        <div id="search-modal" class="hidden absolute inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex flex-col justify-start p-4">
            <div class="bg-white rounded-2xl p-4 shadow-xl flex flex-col space-y-3">
                <div class="flex items-center justify-between">
                    <h3 class="font-bold text-sm text-slate-800">പുസ്തകങ്ങൾ തിരയുക</h3>
                    <button onclick="toggleSearchModal()" class="text-slate-400 p-1">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
                <div class="relative">
                    <input type="text" id="search-input" placeholder="എഴുത്തുകാരൻ അല്ലെങ്കിൽ പുസ്തകത്തിന്റെ പേര്..." class="w-full pl-9 pr-3 py-2 bg-slate-100 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                </div>
                <button onclick="handleSearchSubmit()" class="w-full py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold active:scale-95 transition">
                    തിരയുക
                </button>
            </div>
        </div>

    </div>

    <script>
        // State Management
        let currentTab = 'discover';
        let currentTheme = 'light'; // light, sepia, dark
        let currentLang = 'ml'; // ml or en
        
        let booksData = [];
        let activeBook = null;
        
        let originalParagraphs = [];
        let translatedParagraphs = [];
        let bookPagesML = [];
        let bookPagesEN = [];
        
        let currentPageIndex = 0;

        // Web Speech State
        let synth = window.speechSynthesis;
        let isSpeaking = false;
        let currentUtterance = null;

        // DOM Element Cache
        const discoverView = document.getElementById('discover-view');
        const readerView = document.getElementById('reader-view');
        const booksList = document.getElementById('books-list');
        const loadingState = document.getElementById('loading-state');
        const categoryTitle = document.getElementById('category-title');
        const resultsCount = document.getElementById('results-count');
        const pageContent = document.getElementById('page-content');
        const currentPageNum = document.getElementById('current-page-num');
        const totalPagesNum = document.getElementById('total-pages-num');

        // Initial Launch
        window.addEventListener('DOMContentLoaded', () => {
            fetchBooks('Nobel Prize Winner');
            initTouchSwipe();
        });

        // Tab Navigation Switcher
        function switchTab(tab) {
            currentTab = tab;
            if (tab === 'discover') {
                discoverView.classList.remove('hidden');
                readerView.classList.add('hidden');
                document.getElementById('nav-btn-discover').className = "flex flex-col items-center justify-center text-indigo-600 w-full h-full";
                document.getElementById('nav-btn-reader').className = "flex flex-col items-center justify-center text-slate-400 w-full h-full";
                stopSpeech();
            } else if (tab === 'reader') {
                if (!activeBook) {
                    alert('വായിക്കാൻ ആദ്യം ഒരു പുസ്തകം തിരഞ്ഞെടുക്കുക.');
                    switchTab('discover');
                    return;
                }
                discoverView.classList.add('hidden');
                readerView.classList.remove('hidden');
                document.getElementById('nav-btn-discover').className = "flex flex-col items-center justify-center text-slate-400 w-full h-full";
                document.getElementById('nav-btn-reader').className = "flex flex-col items-center justify-center text-indigo-600 w-full h-full";
            }
        }

        // Fetch Ranked Books via Open Library
        async function fetchBooks(query) {
            categoryTitle.innerText = query;
            booksList.innerHTML = '';
            loadingState.classList.remove('hidden');

            try {
                const response = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&sort=rating&limit=20`);
                const data = await response.json();
                
                loadingState.classList.add('hidden');
                booksData = data.docs || [];
                resultsCount.innerText = `${booksData.length} പുസ്തകങ്ങൾ`;

                renderBooksList(booksData);
            } catch (error) {
                loadingState.classList.add('hidden');
                booksList.innerHTML = `<p class="col-span-2 text-center text-xs text-red-500 py-8">ഡാറ്റ ലോഡ് ചെയ്യാൻ കഴിഞ്ഞില്ല.</p>`;
            }
        }

        // Render Book Cards in Discover View
        function renderBooksList(books) {
            booksList.innerHTML = books.map((book, idx) => {
                const coverUrl = book.cover_i ? `https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg` : 'https://placehold.co/200x300/e2e8f0/475569?text=No+Cover';
                const rating = book.ratings_average ? book.ratings_average.toFixed(1) : (4.8 - (idx * 0.1)).toFixed(1);
                const title = book.title || 'Unknown Title';
                const author = book.author_name ? book.author_name[0] : 'അജ്ഞാതൻ';

                return `
                    <div onclick="openBookReader(${idx})" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col justify-between active:scale-95 transition">
                        <div class="relative aspect-[3/4] bg-slate-100">
                            <img src="${coverUrl}" class="w-full h-full object-cover" loading="lazy">
                            <span class="absolute top-1.5 left-1.5 bg-amber-500 text-white font-bold text-[10px] px-2 py-0.5 rounded-full shadow">
                                #${idx + 1}
                            </span>
                        </div>
                        <div class="p-2 flex flex-col justify-between flex-1">
                            <div>
                                <h3 class="font-bold text-xs text-slate-800 line-clamp-2 leading-tight">${title}</h3>
                                <p class="text-[10px] text-slate-500 truncate mt-0.5">${author}</p>
                            </div>
                            <div class="mt-2 flex items-center justify-between pt-1 border-t border-slate-100">
                                <span class="text-[10px] text-amber-600 font-bold"><i class="fa-solid fa-star"></i> ${rating}</span>
                                <span class="text-[9px] bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded font-semibold">വായിക്കുക</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Prepare and Load Selected Book into Reader View
        async function openBookReader(index) {
            stopSpeech();
            activeBook = booksData[index];
            
            document.getElementById('reader-book-title').innerText = activeBook.title;
            document.getElementById('reader-book-author').innerText = activeBook.author_name ? activeBook.author_name[0] : '';
            
            pageContent.innerHTML = `<div class="p-4 text-center text-xs text-slate-500">പുസ്തകത്തിന്റെ താളുകൾ പരിഭാഷപ്പെടുത്തി തയ്യാറാക്കുന്നു...</div>`;
            
            switchTab('reader');

            // Generate Content & Translations
            const sampleText = activeBook.first_sentence ? activeBook.first_sentence[0] : null;
            let fullText = sampleText || `${activeBook.title} by ${activeBook.author_name ? activeBook.author_name[0] : 'Author'}. This is a world-renowned e-publication recognized for its literary excellence and global popularity.`;
            
            // Try fetching Gutendex plain text if available
            try {
                const gRes = await fetch(`https://gutendex.com/books/?search=${encodeURIComponent(activeBook.title)}`);
                const gData = await gRes.json();
                if (gData.results.length > 0 && gData.results[0].formats['text/plain; charset=us-ascii']) {
                    const rawRes = await fetch(gData.results[0].formats['text/plain; charset=us-ascii']);
                    const rawText = await rawRes.text();
                    fullText = rawText.slice(1000, 4000).replace(/\r\n/g, ' ').replace(/\n/g, ' ');
                }
            } catch (e) {
                console.log("Gutenberg text fetch skipped.");
            }

            // Split into pages (Roughly 350 chars per page for mobile reading)
            originalParagraphs = fullText.match(/.{1,350}(?=\s|$)/g) || [fullText];
            
            // Translate to Malayalam using MyMemory API
            translatedParagraphs = [];
            for (let chunk of originalParagraphs) {
                try {
                    const tRes = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(chunk)}&langpair=en|ml`);
                    const tData = await tRes.json();
                    translatedParagraphs.push(tData.responseData ? tData.responseData.translatedText : chunk);
                } catch (err) {
                    translatedParagraphs.push(chunk);
                }
            }

            bookPagesML = translatedParagraphs;
            bookPagesEN = originalParagraphs;
            currentPageIndex = 0;

            renderCurrentPage();
        }

        // Render Page Content in eBook View
        function renderCurrentPage() {
            const pages = currentLang === 'ml' ? bookPagesML : bookPagesEN;
            totalPagesNum.innerText = pages.length;
            currentPageNum.innerText = currentPageIndex + 1;

            if (pages.length > 0) {
                pageContent.innerHTML = `<p class="leading-relaxed font-medium">${pages[currentPageIndex]}</p>`;
            }

            // Update Navigation Buttons state
            document.getElementById('prev-page-btn').disabled = currentPageIndex === 0;
            document.getElementById('next-page-btn').disabled = currentPageIndex >= pages.length - 1;
        }

        // Page Turning Actions
        function nextPage() {
            const pages = currentLang === 'ml' ? bookPagesML : bookPagesEN;
            if (currentPageIndex < pages.length - 1) {
                stopSpeech();
                currentPageIndex++;
                animatePageFlip('next');
                renderCurrentPage();
            }
        }

        function prevPage() {
            if (currentPageIndex > 0) {
                stopSpeech();
                currentPageIndex--;
                animatePageFlip('prev');
                renderCurrentPage();
            }
        }

        // Page Flip Animation Effect
        function animatePageFlip(dir) {
            const card = document.getElementById('page-card');
            card.classList.add(dir === 'next' ? 'page-flip-next-enter' : 'page-flip-prev-enter');
            setTimeout(() => {
                card.classList.remove('page-flip-next-enter', 'page-flip-prev-enter');
            }, 200);
        }

        // Switch Reader Language (Malayalam <-> English)
        function setReaderLanguage(lang) {
            currentLang = lang;
            stopSpeech();
            
            if (lang === 'ml') {
                document.getElementById('lang-btn-ml').className = "flex-1 py-1 font-bold rounded-md bg-white shadow-sm text-indigo-700 text-center transition";
                document.getElementById('lang-btn-en').className = "flex-1 py-1 font-medium text-slate-600 text-center transition";
            } else {
                document.getElementById('lang-btn-ml').className = "flex-1 py-1 font-medium text-slate-600 text-center transition";
                document.getElementById('lang-btn-en').className = "flex-1 py-1 font-bold rounded-md bg-white shadow-sm text-indigo-700 text-center transition";
            }
            renderCurrentPage();
        }

        // Reader Theme Switcher (Light, Sepia, Dark)
        function toggleReaderTheme() {
            const readerSec = document.getElementById('reader-view');
            if (currentTheme === 'light') {
                currentTheme = 'sepia';
                readerSec.className = "absolute inset-0 z-30 flex flex-col theme-sepia transition-colors duration-200";
            } else if (currentTheme === 'sepia') {
                currentTheme = 'dark';
                readerSec.className = "absolute inset-0 z-30 flex flex-col theme-dark transition-colors duration-200";
            } else {
                currentTheme = 'light';
                readerSec.className = "absolute inset-0 z-30 flex flex-col theme-light transition-colors duration-200";
            }
        }

        function toggleSpeech() {
            if (isSpeaking) {
                stopSpeech();
            } else {
                startSpeech();
            }
        }

        function startSpeech() {
            const pages = currentLang === 'ml' ? bookPagesML : bookPagesEN;
            const textToRead = pages[currentPageIndex];
            
            if (!textToRead) return;

            currentUtterance = new SpeechSynthesisUtterance(textToRead);
            
            if (currentLang === 'ml') {
                currentUtterance.lang = 'ml-IN';
                currentUtterance.pitch = 1.1; // Optimized Female Pitch
                currentUtterance.rate = 0.88;  // Natural speaking pace
            } else {
                currentUtterance.lang = 'en-US';
                currentUtterance.pitch = 1.1;
                currentUtterance.rate = 0.95;
            }

            // Find best available female voice
            const voices = synth.getVoices();
            const targetLang = currentLang === 'ml' ? 'ml' : 'en';
            const femaleVoice = voices.find(v => v.lang.includes(targetLang) && (v.name.includes('Female') || v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Zira') || v.name.includes('Samantha')));
            
            if (femaleVoice) {
                currentUtterance.voice = femaleVoice;
            }

            currentUtterance.onstart = () => {
                isSpeaking = true;
                document.getElementById('play-pause-btn').innerHTML = `<i class="fa-solid fa-pause"></i>`;
            };

            currentUtterance.onend = () => {
                stopSpeech();
            };

            currentUtterance.onerror = () => {
                stopSpeech();
            };

            synth.speak(currentUtterance);
        }

        function stopSpeech() {
            if (synth.speaking) {
                synth.cancel();
            }
            isSpeaking = false;
            document.getElementById('play-pause-btn').innerHTML = `<i class="fa-solid fa-play"></i>`;
        }

        // Swipe Touch Gesture logic for eBook Page Turning
        function initTouchSwipe() {
            const pageArea = document.getElementById('page-area');
            let startX = 0;

            pageArea.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
            }, { passive: true });

            pageArea.addEventListener('touchend', (e) => {
                const endX = e.changedTouches[0].clientX;
                const diffX = startX - endX;

                if (diffX > 50) {
                    nextPage(); // Swipe Left -> Next Page
                } else if (diffX < -50) {
                    prevPage(); // Swipe Right -> Previous Page
                }
            }, { passive: true });
        }

        // Modal Logic
        function toggleSearchModal() {
            document.getElementById('search-modal').classList.toggle('hidden');
        }

        function handleSearchSubmit() {
            const query = document.getElementById('search-input').value.trim();
            if (query) {
                toggleSearchModal();
                fetchBooks(query);
            }
        }
    </script>
</body>
</html>
